services:
  db:
    image: postgres:16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    # Only the api runs migrations, so api and worker never race.
    command: sh -c "alembic upgrade head && uvicorn app.api.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    environment:
      RAW_DIR: /data/raw
    ports:
      - "8000:8000"
    volumes:
      - raw:/data/raw
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    build: ./backend
    command: python -m app.worker
    stop_grace_period: 10m
    env_file: .env
    environment:
      RAW_DIR: /data/raw
    volumes:
      - raw:/data/raw
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  raw:
