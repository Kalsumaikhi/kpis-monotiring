services:
  db:
    image: postgres:16
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      RAW_DIR: /data/raw
    ports:
      - "8000:8000"
    volumes:
      - raw:/data/raw
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    command: python -m app.worker
    env_file: .env
    environment:
      RAW_DIR: /data/raw
    volumes:
      - raw:/data/raw
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  raw:
