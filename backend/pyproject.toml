[project]
name = "kpi-monitor"
version = "0.1.0"
description = "Fetches country KPI datasets, diffs them in Postgres and posts Mattermost alerts"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "beautifulsoup4>=4.12",
    "python-multipart>=0.0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]
browser = ["playwright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: slow tests (deselect with -m \"not slow\")"]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
