server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 60m;

  # Docker's embedded DNS. With a variable in proxy_pass nginx resolves "api" per request
  # (cached 10s) instead of once at start, so a recreated api container (new IP) is found.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    # No URI part after the host, so the original request URI (including /api/) is passed
    # unchanged, exactly as before.
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    # keep the browser's native Basic-auth dialog from covering the custom login
    proxy_hide_header WWW-Authenticate;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
